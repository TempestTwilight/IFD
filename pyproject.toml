[project]
name = "ifd-part2"
version = "0.1.0"
description = "..."
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "flwr>=1.33,<2",
    "joblib>=1.5,<2",
    "matplotlib>=3.11.2",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "ray>=2.57,<3",
    "scikit-learn>=1.9,<2",
    "torch>=2.13,<3",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=9.1,<10",
    "pytest-cov>=6.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["E501", "S101", "N806", "N803", "RUF001", "RUF002", "RUF003", "SIM108", "B007", "RUF059", "SIM102", "B905", "B028", "E402", "RUF005", "RUF046", "SIM112"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=. --cov-report=term-missing"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = [
    "results/**",
]
